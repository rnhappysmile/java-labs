<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Java Labs</title>
    <style>
        body { font-family: 'Arial', sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { padding: 20px; }
        .footer { text-align: center; font-size: 0.8em; color: #777; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Java Labs!</h1>
        </div>
        <div class="content">
            <p>안녕하세요, <strong th:text="${name}">사용자</strong>님!</p>
            <p>Java Labs의 회원이 되신 것을 진심으로 축하드립니다.</p>
            <p>앞으로 다양한 백엔드 엔지니어링 실습을 함께 진행하며 성장해 나갔으면 좋겠습니다.</p>
            <br>
            <p>감사합니다.</p>
            <p>- Java Labs 팀 드림 -</p>
        </div>
        <div class="footer">
            <p>© 2026 Java Labs. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
